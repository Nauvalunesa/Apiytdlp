<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated Background */
        .background-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            opacity: 0.4;
            animation: float 8s infinite ease-in-out, pulse 2s infinite alternate;
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.5);
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) translateX(0) rotate(0deg);
            }
            25% {
                transform: translateY(-30px) translateX(20px) rotate(90deg);
            }
            50% {
                transform: translateY(-15px) translateX(-20px) rotate(180deg);
            }
            75% {
                transform: translateY(-35px) translateX(15px) rotate(270deg);
            }
        }

        @keyframes pulse {
            from {
                opacity: 0.3;
                transform: scale(1);
            }
            to {
                opacity: 0.6;
                transform: scale(1.2);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes gradient {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        @keyframes glow {
            0%, 100% {
                box-shadow: 0 0 20px rgba(102, 126, 234, 0.4),
                            0 0 40px rgba(118, 75, 162, 0.3),
                            0 0 60px rgba(102, 126, 234, 0.2);
            }
            50% {
                box-shadow: 0 0 30px rgba(102, 126, 234, 0.6),
                            0 0 60px rgba(118, 75, 162, 0.5),
                            0 0 90px rgba(102, 126, 234, 0.4);
            }
        }

        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 60px 40px;
            background: rgba(30, 30, 45, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5),
                        0 0 0 1px rgba(255, 255, 255, 0.1);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            animation: fadeInUp 0.8s ease-out;
            max-width: 500px;
            width: 90%;
        }

        .container:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6),
                        0 0 0 1px rgba(255, 255, 255, 0.15);
        }

        .logo-container {
            margin-bottom: 40px;
            animation: fadeInUp 1s ease-out 0.2s backwards;
        }

        .logo-text {
            font-size: 3.5em;
            font-weight: 800;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradient 3s ease infinite, glow 3s ease-in-out infinite;
            letter-spacing: -1px;
            text-shadow: 0 0 30px rgba(102, 126, 234, 0.5);
        }

        .logo-subtitle {

            color: #a0a0b0;
            font-weight: 400;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .features {

        .feature-badge {

            border-radius: 20px;
            font-size: 0.85em;
            border: 1px solid rgba(102, 126, 234, 0.3);

        }

        .feature-badge:hover {

            border-color: rgba(102, 126, 234, 0.6);

        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 18px;
            margin-top: 40px;
            animation: fadeInUp 1s ease-out 0.6s backwards;
            width: 100%;
        }

        .button {

            color: #fff;

            justify-content: center;
            gap: 12px;
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
            position: relative;
            overflow: hidden;
        }

        .button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .button:hover::before {
            left: 100%;
        }

        .button:hover {
            transform: translateY(-5px) scale(1.03);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.5);
            animation: gradient 2s ease infinite;
        }

        .button:active {

        .button.donate-button {

        }

        .button.donate-button:hover {

        }

        .button.whatsapp-button {

        }

        .button.whatsapp-button:hover {

        }

        .button svg {

        }

        .source-code {

        .source-code a {

        }

        .source-code a svg {

        /* Responsive Design */

        }

        /* Scrollbar Styling */

        }

        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, #764ba2, #667eea);
        }
    </style>

    <script>
        const backgroundAnimation = document.getElementById('backgroundAnimation');
        const numberOfParticles = 20;

        function createParticle() {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            const size = Math.random() * 30 + 15;
            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            particle.style.left = `${Math.random() * 100}vw`;
            particle.style.top = `${Math.random() * 100}vh`;
            particle.style.animationDelay = `${Math.random() * 5}s, ${Math.random() * 2}s`;
            particle.style.animationDuration = `${Math.random() * 10 + 8}s, ${Math.random() * 3 + 2}s`;
            backgroundAnimation.appendChild(particle);

            particle.addEventListener('animationiteration', () => {
                if (Math.random() > 0.5) {
                    particle.remove();
                    createParticle();
                }
            });
        }

        for (let i = 0; i < numberOfParticles; i++) {
            setTimeout(() => createParticle(), i * 100);
        }
    </script>
